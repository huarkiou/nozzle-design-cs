name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        type: string
      include_rust_tools:
        description: 'Download otn/sltn from nozzle-design-rs latest release'
        required: true
        type: boolean
        default: true
      include_obj_viewer:
        description: 'Download objviewer from its latest release'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: .exe
            asset_suffix: windows
          - os: ubuntu-latest
            rid: linux-x64
            ext: ''
            asset_suffix: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── .NET Native AOT 发布 ──────────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish GuiApp (Native AOT)
        run: dotnet publish GuiApp -c Release -r ${{ matrix.rid }} -o publish/GuiApp -p:DebugSymbols=false -p:DebugType=none

      # ── 创建 tools 目录 ────────────────────────────────────────────────
      - name: Create tools directory
        shell: bash
        run: mkdir -p publish/GuiApp/tools

      # ── 下载 nozzle-design-rs 预编译工具 ──────────────────────────────
      - name: Download otn/sltn from nozzle-design-rs
        if: ${{ inputs.include_rust_tools }}
        shell: bash
        run: |
          repo="huarkiou/nozzle-design-rs"
          release=$(gh release view --repo "$repo" --json tagName,assets)
          tag=$(echo "$release" | jq -r '.tagName')
          echo "Latest nozzle-design-rs release: $tag"

          case "${{ matrix.asset_suffix }}" in
            windows) pattern="windows.*[.]zip" ;;
            linux)   pattern="linux.*[.]tar[.]gz" ;;
          esac

          asset=$(echo "$release" | jq -r ".assets[] | select(.name | test(\"$pattern\")) | .name" | head -1)

          if [ -n "$asset" ]; then
            gh release download "$tag" --repo "$repo" --pattern "$asset" --dir rs-tools

            case "${{ matrix.asset_suffix }}" in
              windows)
                unzip -o "rs-tools/$asset" -d rs-tools
                cp rs-tools/otn${{ matrix.ext }} publish/GuiApp/tools/otn${{ matrix.ext }}
                cp rs-tools/sltn${{ matrix.ext }} publish/GuiApp/tools/sltn${{ matrix.ext }}
                ;;
              linux)
                tar -xzf "rs-tools/$asset" -C rs-tools
                cp rs-tools/otn publish/GuiApp/tools/otn
                cp rs-tools/sltn publish/GuiApp/tools/sltn
                chmod +x publish/GuiApp/tools/otn publish/GuiApp/tools/sltn
                ;;
            esac
            echo "Copied otn/sltn (${{ matrix.asset_suffix }})"
          else
            echo "Warning: No nozzle-design-rs ${{ matrix.asset_suffix }} asset found"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # ── 下载 objviewer ─────────────────────────────────────────────────
      - name: Download objviewer (latest release)
        if: ${{ inputs.include_obj_viewer }}
        shell: bash
        run: |
          repo="huarkiou/objviewer"
          release=$(gh release view --repo "$repo" --json tagName,assets)
          tag=$(echo "$release" | jq -r '.tagName')
          echo "Latest objviewer release: $tag"

          case "${{ matrix.asset_suffix }}" in
            windows) pattern="windows.*[.]zip" ;;
            linux)   pattern="linux.*[.]tar[.]gz" ;;
          esac

          asset=$(echo "$release" | jq -r ".assets[] | select(.name | test(\"$pattern\")) | .name" | head -1)

          if [ -n "$asset" ]; then
            gh release download "$tag" --repo "$repo" --pattern "$asset" --dir objviewer-dl

            case "${{ matrix.asset_suffix }}" in
              windows)
                unzip -o "objviewer-dl/$asset" -d objviewer-dl
                cp objviewer-dl/objviewer.exe publish/GuiApp/tools/objviewer.exe
                ;;
              linux)
                tar -xzf "objviewer-dl/$asset" -C objviewer-dl
                cp objviewer-dl/objviewer publish/GuiApp/tools/objviewer
                chmod +x publish/GuiApp/tools/objviewer
                ;;
            esac
            echo "Copied objviewer (${{ matrix.asset_suffix }})"
          else
            echo "Warning: No objviewer ${{ matrix.asset_suffix }} asset found"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # ── 清除 PDB 等调试文件 ───────────────────────────────────────────
      - name: Strip debug files
        shell: bash
        run: |
          find publish/GuiApp -name '*.pdb' -delete
          find publish/GuiApp -name '*.dbg' -delete

      # ── 打包 ───────────────────────────────────────────────────────────
      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archive = "nozzle-design-cs_${{ inputs.version }}_${{ matrix.asset_suffix }}-x64.zip"
          Compress-Archive -Path publish\GuiApp\* -DestinationPath $archive
          echo "archive=$archive" >> $env:GITHUB_ENV

      - name: Create archive (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          archive="nozzle-design-cs_${{ inputs.version }}_${{ matrix.asset_suffix }}-x64.zip"
          (cd publish/GuiApp && zip -r "../../$archive" .)
          echo "archive=$archive" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_suffix }}-x64
          path: ${{ env.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            windows-x64/*.zip
            linux-x64/*.zip
